<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>发帖 · GG 玩家社区</title>
<link rel="stylesheet" href="../css/system.css" />
<style>
  .cover-drop { aspect-ratio:16/7; border:2px dashed var(--fg); border-radius:var(--radius-md); display:grid; place-items:center; background:var(--surface-warm); cursor:pointer; text-align:center; }
  .cover-drop:hover { border-color:var(--accent); }
  .title-input { font-size:var(--text-xl); font-weight:800; border:none; box-shadow:none; padding:8px 0; border-bottom:2px solid var(--border); border-radius:0; }
  .title-input:focus { box-shadow:none; border-bottom-color:var(--accent); }
  .tag-pick { display:flex; gap:10px; flex-wrap:wrap; }
  .tag-opt { padding:8px 16px; border:2px solid var(--fg); border-radius:var(--radius-pill); font-weight:700; font-size:var(--text-sm); cursor:pointer; background:var(--surface); }
  .tag-opt.on { background:var(--accent); color:#fff; box-shadow:3px 3px 0 var(--fg); }
  .editor-grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-5); }
  .preview { border:2px solid var(--border); border-radius:var(--radius-md); padding:var(--space-5); background:var(--surface); min-height:280px; overflow:auto; }
  .preview h3 { margin:14px 0 6px; }
  .preview p { margin:8px 0; color:var(--fg-2); }
  @media(max-width:820px){ .editor-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-od-id="sidebar">
    <div class="brand"><span class="brand-mark">GG</span><span>玩家社区</span></div>
    <a class="nav-link" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>首页</span></a>
    <a class="nav-link" href="chatbot.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 16 0Z"/></svg><span>攻略助手</span></a>
    <a class="nav-link active" href="compose.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span>发帖</span></a>
    <a class="nav-link" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>我的</span></a>
    <div class="nav-sep"></div>
    <div class="nav-foot"><a class="nav-user" href="profile.html"><span class="avatar avatar-md cv-4">阿</span><span class="nav-user-meta"><strong style="display:block;font-size:13px">阿岚</strong><span style="font-size:11px;color:var(--muted)">Lv.18 · 攻略组</span></span></a></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="container row-between">
        <h1 class="h-md">写新帖子</h1>
        <div class="row" style="gap:10px">
          <button class="btn btn-sm btn-ghost" id="draftState">已自动保存草稿 ✓</button>
          <button class="btn btn-sm btn-secondary">存草稿</button>
          <button class="btn btn-sm btn-primary" id="publish">发布</button>
        </div>
      </div>
    </header>

    <div class="container page-pad stack" style="gap:var(--space-6);max-width:920px">
      <!-- 封面 -->
      <div class="field" data-od-id="cover">
        <label>帖子封面</label>
        <div class="cover-drop"><div><div style="font-size:32px">🖼️</div><strong>点击上传封面图</strong><div class="muted" style="font-size:var(--text-xs)">建议 16:9 · JPG/PNG · ≤ 5MB</div></div></div>
      </div>

      <!-- 标题 -->
      <div class="field" data-od-id="title">
        <input class="input title-input" id="title" placeholder="起一个吸引人的标题…" maxlength="50" />
        <span class="muted" style="font-size:var(--text-xs);text-align:right"><span id="tcount">0</span>/50</span>
      </div>

      <!-- 标签 -->
      <div class="field" data-od-id="tags">
        <label>选择标签（至少 1 个）</label>
        <div class="tag-pick" id="tagPick">
          <span class="tag-opt">📰 资讯</span><span class="tag-opt">🧭 攻略</span><span class="tag-opt">🆘 求助</span><span class="tag-opt">⭐ 评测</span><span class="tag-opt">🎉 活动</span>
        </div>
      </div>

      <!-- 编辑器 + 预览 -->
      <div class="field" data-od-id="editor">
        <div class="row-between"><label>正文（支持 Markdown）</label><span class="muted" style="font-size:var(--text-xs)"><span id="wcount">0</span> 字</span></div>
        <div class="editor-grid">
          <textarea class="textarea" id="content" style="min-height:280px" placeholder="## 小标题&#10;在这里写下你的攻略 / 评测 / 提问…&#10;&#10;- 列表项&#10;- 列表项&#10;&#10;**加粗** 让重点更醒目"></textarea>
          <div class="preview" id="preview"><span class="muted">实时预览会显示在这里…</span></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/app.js"></script>
<script>
  const title = document.getElementById('title');
  const content = document.getElementById('content');
  const preview = document.getElementById('preview');
  title.addEventListener('input', () => document.getElementById('tcount').textContent = title.value.length);
  content.addEventListener('input', render);

  function render() {
    document.getElementById('wcount').textContent = content.value.length;
    const html = content.value
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/^## (.*)$/gm,'<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/^- (.*)$/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
      .replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
    preview.innerHTML = content.value ? '<p>'+html+'</p>' : '<span class="muted">实时预览会显示在这里…</span>';
    document.getElementById('draftState').textContent = '正在编辑…';
    clearTimeout(window._d);
    window._d = setTimeout(()=>document.getElementById('draftState').textContent='已自动保存草稿 ✓', 1000);
  }

  document.getElementById('tagPick').addEventListener('click', e => {
    const t = e.target.closest('.tag-opt'); if (t) t.classList.toggle('on');
  });
  document.getElementById('publish').addEventListener('click', () => {
    if (!title.value.trim()) return alert('请先填写标题');
    if (!document.querySelector('.tag-opt.on')) return alert('请至少选择一个标签');
    alert('发布成功！🎉 即将返回首页');
    location.href = 'home.html';
  });
</script>
</body>
</html>
